data:
    raw_path: data/raw/glass.csv
    processed_data: data/processed
    test_size: 0.2
    validation_size: 0.1
    drop_columns:
        - Ba
        - Fe
    fillna_mean_columns:
        - Mg
        - K

model:
    algorithm: LightGBM
    hyperparameters:
        max_depth=3,
        num_leaves=7,
        learning_rate=0.05,
        min_child_samples=10,
        verbose=-1

training:
    random_state: 15
    stratify: true
    scaler: StandardScaler
    label_encoder: LabelEncoder
    target_column: Type
    metrics:
        - accuracy
        - precision
        - recall
        - f1
